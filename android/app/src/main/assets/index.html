<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="bot-management.css"><link rel="stylesheet" href="bot-identity.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="devices.css"><title>Pulse Bot</title></head>
<body><svg class="symbols" aria-hidden="true"><defs id="iconSymbols"></defs></svg><div class="app-shell">
<header id="mainHeader" class="main-header"><button id="profileButton" class="account-avatar" aria-label="打开设置">B</button><div class="header-actions"><button id="openSearch" class="icon-button" aria-label="搜索"><svg><use href="#i-search"/></svg></button><button id="newBot" class="icon-button" aria-label="新建"><svg><use href="#i-plus"/></svg></button></div></header>
<header id="subHeader" class="detail-header" hidden><button id="subBack" class="icon-button round" aria-label="返回"><svg><use href="#i-back"/></svg></button><h2 id="subTitle"></h2><button id="subAction" class="plain-button"></button></header>
<main>
<section id="page-home" class="page scroll-page active"><div id="botSearchBox" class="search-field" hidden><svg><use href="#i-search"/></svg><input id="botSearch" placeholder="搜索助手或对话" aria-label="搜索助手或对话"><button id="closeSearch">取消</button></div><div class="list-caption"><span>你的助手</span><button id="openRoutines" class="plain-button">例行任务 <span id="routineCount"></span></button></div><button id="connectionBanner" class="connection-banner" data-config="connection"><i id="connectionDot"></i><span id="connectionLabel">尚未连接</span><span id="connectionHint">连接你的助理</span><svg><use href="#i-next"/></svg></button><div class="workspace-shortcuts"><button data-route="computer"><svg><use href="#i-cloud"/></svg>云电脑</button><button data-route="local"><svg><use href="#i-screen"/></svg>此手机</button></div><div id="botList" class="bot-list"></div><button id="showHiddenBots" class="hidden-bots-link" data-route="hiddenBots" hidden></button><button id="addAssistant" class="add-assistant"><span>＋</span>创建新助手</button><div id="attentionList"></div><div class="home-note"><span>✧</span><p>有结果、有问题，才来找你。</p><button id="snoozeHome">安静一小时</button></div></section>
<section id="page-chat" class="page chat-page"><header class="chat-header"><button id="chatBack" class="icon-button round" aria-label="返回助手列表"><svg><use href="#i-back"/></svg></button><button id="chatIdentity" class="chat-identity"></button><button id="chatMenu" class="icon-button round" aria-label="对话选项"><svg><use href="#i-more"/></svg></button></header><div id="chatScroll" class="chat-scroll"><div id="conversationEmpty" class="conversation-empty"></div><div id="messages" class="messages"></div><div id="thinking" class="thinking" hidden><i></i><span id="thinkingText">正在思考</span></div><div id="executionLive" class="execution-live" hidden></div></div><form id="chatForm" class="composer"><div id="replyContext" class="reply-context" hidden></div><div class="composer-line"><button id="chatActions" class="icon-button round composer-plus" type="button" aria-label="打开工具"><svg><use href="#i-plus"/></svg></button><div class="composer-box"><textarea id="chatInput" rows="1" maxlength="12000" placeholder="发消息…" aria-label="聊天消息"></textarea><button id="sendButton" class="send-button" type="submit" aria-label="发送消息" disabled><svg><use href="#i-send"/></svg></button><button id="stopButton" class="stop-button" type="button" aria-label="停止执行" hidden><span></span></button></div></div><div class="composer-caption"><button id="modeButton" type="button"></button><span id="composerStatus">尚未连接</span></div></form></section>
<section id="page-hiddenBots" class="page scroll-page"><p class="intro-text">隐藏只会移出首页。对话、记忆和例行任务会保留。</p><div id="hiddenBotList"></div></section>
<section id="page-profile" class="page scroll-page"><div id="botProfile"></div></section>
<section id="page-botSettings" class="page scroll-page"><div id="botSettings"></div></section>
<section id="page-settings" class="page scroll-page"><div class="account-card"><span class="account-avatar big">B</span><strong>你的私人空间</strong><small id="accountSubtitle">Pulse Bot</small></div><div id="settingsRows"></div><button id="syncButton" class="primary full">保存并同步至云端启动 Harness</button><p id="syncFeedback" class="field-feedback">密钥保存在手机安全存储中</p><div class="about-line">Pulse Bot <span>1.7.0</span></div></section>
<section id="page-config" class="page scroll-page"><form id="configForm"><p id="configIntro" class="intro-text"></p><div id="configFields"></div><button id="saveConfig" class="primary full" type="submit">保存并同步</button><p id="configFeedback" class="field-feedback"></p></form></section>
<section id="page-tools" class="page scroll-page"><div class="search-field"><svg><use href="#i-search"/></svg><input id="toolSearch" placeholder="搜索工具" aria-label="搜索工具"></div><div id="toolFilters" class="filter-pills"><button data-category="all" class="selected">全部</button><button data-category="cloud">云端</button><button data-category="phone">手机</button><button data-category="automation">自动化</button></div><div id="toolList"></div><p class="section-foot">点开查看工具详情与运行条件</p></section>
<section id="page-toolDetail" class="page scroll-page"><div id="toolDetail"></div></section>
<section id="page-vault" class="page scroll-page"><p class="intro-text">它记住的，你都看得见，也都能修改。</p><div class="search-field"><svg><use href="#i-search"/></svg><input id="fileSearch" placeholder="搜索记忆文件" aria-label="搜索记忆文件"></div><div id="vaultFilters" class="filter-pills"><button data-folder="all" class="selected">全部</button><button data-folder="profile">档案</button><button data-folder="tasks">任务</button><button data-folder="timeline">时间轴</button><button data-folder="playbooks">手册</button></div><div class="list-caption"><span><b id="vaultCount">0</b> 份 Markdown</span><button id="refreshVault" class="plain-button">刷新</button></div><div id="vaultFiles"></div></section>
<section id="page-editor" class="page editor-page"><div class="segmented"><button id="previewTab" class="selected">阅读</button><button id="editTab">编辑</button></div><article id="markdownPreview" class="markdown"></article><textarea id="markdownEditor" class="markdown-editor" aria-label="Markdown 编辑器" spellcheck="false" hidden></textarea><small id="editorHint">云端已同步</small></section>
<section id="page-routines" class="page scroll-page"><p class="intro-text">设定一件事，让助手定期替你完成。</p><div id="routineList"></div></section>
<section id="page-routineDetail" class="page scroll-page"><div id="routineDetail"></div></section>
<section id="page-root" class="page scroll-page"><div id="rootContent"></div></section>
<section id="page-appearance" class="page scroll-page"><div id="appearanceContent"></div></section>
<section id="page-identity" class="page scroll-page"><div id="identityContent"></div></section>
<section id="page-avatarCrop" class="page scroll-page"><div id="avatarCropContent"></div></section>
<section id="page-primaryBot" class="page scroll-page"><div id="primaryBotContent"></div></section>
<section id="page-local" class="page scroll-page"><div id="localContent"></div></section>
<section id="page-computer" class="page scroll-page"><div id="computerContent"></div></section>
<section id="page-library" class="page scroll-page"><div id="libraryContent"></div></section>
</main></div><div id="toast" class="toast" role="status"></div>
<dialog id="sheet" class="bottom-sheet"><div class="sheet-handle"></div><div class="sheet-header"><h2 id="sheetTitle"></h2><button id="closeSheet" class="icon-button" aria-label="关闭面板"><svg><use href="#i-close"/></svg></button></div><div id="sheetBody"></div></dialog>
<script src="vendor/marked.js"></script><script src="vendor/purify.js"></script><script src="motion.js"></script><script src="devices.js"></script><script src="bot-management.js"></script><script src="bot-identity.js"></script><script src="app.js"></script></body></html>
